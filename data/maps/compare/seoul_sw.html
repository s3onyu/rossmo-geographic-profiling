        const crimes = [{"id": 1, "lat": 37.4912, "lon": 126.8567, "date": "2024-01-10", "location": "구로구 개봉동"}, {"id": 2, "lat": 37.4823, "lon": 126.8912, "date": "2024-02-03", "location": "관악구 신림동"}, {"id": 3, "lat": 37.5089, "lon": 126.8734, "date": "2024-02-25", "location": "양천구 신월동"}, {"id": 4, "lat": 37.4756, "lon": 126.8845, "date": "2024-03-18", "location": "관악구 봉천동"}, {"id": 5, "lat": 37.4967, "lon": 126.8623, "date": "2024-04-12", "location": "구로구 오류동"}];

            posGroups[key].push(c);

        for (const key in posGroups) {
            const group = posGroups[key];
            const n = group.length;
            group.forEach((c, idx) => {
                let lat = c.lat, lon = c.lon;
                if (n > 1) {
                    const angle = (2 * Math.PI * idx) / n;
                    const offset = 0.0008;
                    lat = c.lat + offset * Math.cos(angle);
                    lon = c.lon + offset * Math.sin(angle);
                }
                L.circleMarker([lat, lon], {
                    radius: 7, color: 'blue', fillColor: 'blue', fillOpacity: 0.8, weight: 2
                }).addTo(map).bindPopup(`${c.id}차 - ${c.location}`);
            });
        }
        
        let heatLayer = null;
        let topMarker = null;
        
        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2-lat1) * Math.PI/180;
            const dLon = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }
